<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Config Migration Extension</title>
  <style>
    /* Base layout and theme similar to Dynamics 365 */
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 12px;
      color: #323130;
      background-color: #ffffff;
      min-width: 640px;
      min-height: 480px;
      margin: 0;
      padding: 12px;
    }

    h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
      font-weight: 600;
      color: #201f1e;
    }

    .toolbar {
      margin-bottom: 8px;
      display: flex;
      gap: 8px;
    }

    button {
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 12px;
      padding: 4px 10px;
      border: 1px solid #8a8886;
      border-radius: 2px;
      background-color: #f3f2f1;
      color: #201f1e;
      cursor: pointer;
    }

    button:hover {
      background-color: #e1dfdd;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    /* Schema Modal */
    #schemaModal {
      display: none;
      position: fixed;
      top: 8%;
      left: 8%;
      width: 84%;
      height: 84%;
      background: #ffffff;
      border: 1px solid #c8c6c4;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
      padding: 12px;
      z-index: 9999;
    }

    #schemaModal.show {
      display: flex;
      flex-direction: column;
    }

    .schema-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .schema-header h4 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: #201f1e;
    }

    #btnCloseSchemaX {
      border: none;
      background: transparent;
      color: #201f1e;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    #btnCloseSchemaX:hover {
      color: #a4262c;
    }

    .section {
      margin-bottom: 8px;
    }

    .section label {
      font-weight: 600;
      display: inline-block;
      margin-bottom: 2px;
    }

    #entityInput {
      width: 260px;
      padding: 2px 4px;
      border: 1px solid #c8c6c4;
      border-radius: 2px;
      font-size: 12px;
      background-color: #ffffff;
    }

    #attributeSearch {
      width: 260px;
      padding: 2px 4px;
      border: 1px solid #c8c6c4;
      border-radius: 2px;
      font-size: 12px;
    }

    .checkbox-inline {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }

    .schema-actions {
      margin-top: 4px;
      margin-bottom: 4px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .schema-filter-toolbar {
      margin-bottom: 4px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .grid-container {
      border: 1px solid #c8c6c4;
      border-radius: 2px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      height: 60%;
      min-height: 220px;
    }

    .grid-header {
      background-color: #f3f2f1;
      border-bottom: 1px solid #e1dfdd;
    }

    .grid-header table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .grid-header th {
      padding: 4px 6px;
      font-size: 12px;
      font-weight: 600;
      color: #201f1e;
      text-align: left;
      border-right: 1px solid #e1dfdd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .grid-body {
      flex: 1;
      overflow-y: auto;
    }

    .grid-body table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .grid-body td {
      padding: 4px 6px;
      font-size: 12px;
      border-bottom: 1px solid #e1dfdd;
      border-right: 1px solid #e1dfdd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .grid-body tr:nth-child(even) {
      background-color: #faf9f8;
    }

    .grid-body tr:hover {
      background-color: #edebe9;
    }

    .col-select {
      width: 50px;
      text-align: center;
    }

    .col-select input[type="checkbox"] {
      margin: 0;
      display: inline-block;
    }

    .col-attribute {
      width: 22%;
    }

    .col-displayname {
      width: 28%;
    }

    .col-type {
      width: 14%;
      text-align: center;
    }

    .col-compare {
      width: 14%;
      text-align: center;
    }

    .col-create {
      width: 14%;
      text-align: center;
    }

    /* Import Modal */
    #importModal {
      display: none;
      position: fixed;
      top: 10%;
      left: 10%;
      width: 80%;
      max-height: 80%;
      background: #ffffff;
      border: 1px solid #c8c6c4;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
      padding: 12px;
      z-index: 9999;
    }

    #importModal.show {
      display: flex;
      flex-direction: column;
    }

    .import-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .import-header h4 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: #201f1e;
    }

    #btnCloseImportX {
      border: none;
      background: transparent;
      color: #201f1e;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    #btnCloseImportX:hover {
      color: #a4262c;
    }

    .import-section {
      margin-bottom: 8px;
    }

    .env-radio-list {
      border: 1px solid #c8c6c4;
      padding: 6px;
      max-height: 140px;
      overflow-y: auto;
    }

    .env-radio-item {
      margin-bottom: 4px;
      font-size: 12px;
    }

    #manualEnvUrl {
      width: 100%;
      padding: 2px 4px;
      border: 1px solid #c8c6c4;
      border-radius: 2px;
      font-size: 12px;
      margin-top: 4px;
    }

    .import-actions {
      margin-top: 8px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* Filter Modal */
    #filterModal {
      display: none;
      position: fixed;
      top: 18%;
      left: 18%;
      width: 64%;
      background: #ffffff;
      border: 1px solid #c8c6c4;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
      padding: 12px;
      z-index: 9999;
      flex-direction: column;
      overflow-x: auto;
    }

    #filterModal.show {
      display: flex;
    }

    .filter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .filter-header h4 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: #201f1e;
    }

    #btnCloseFilterX {
      border: none;
      background: transparent;
      color: #201f1e;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    #btnCloseFilterX:hover {
      color: #a4262c;
    }

    .filter-rows-container {
      border: 1px solid #c8c6c4;
      padding: 6px;
      max-height: 260px;
      overflow-y: auto;
      overflow-x: auto;
      /* allow horizontal scroll */
      margin-bottom: 8px;
      white-space: nowrap;
      /* prevent hard wrapping of content */
    }



    .filter-row {
      display: grid;
      grid-template-columns: 24px minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 4px;
      align-items: center;
      margin-bottom: 4px;
    }

    .filter-row select,
    .filter-row input[type="text"] {
      width: 100%;
      min-width: 0;
      padding: 2px 4px;
      border: 1px solid #c8c6c4;
      border-radius: 2px;
      font-size: 12px;
      box-sizing: border-box;
    }

    .filter-row-header {
      text-align: center;
    }

    .filter-row-header button {
      padding: 2px 4px;
      font-size: 11px;
    }

    .filter-row-actions {
      margin-bottom: 8px;
      display: flex;
      justify-content: flex-start;
      gap: 8px;
      align-items: center;
    }

    .filter-row-actions label {
      font-size: 11px;
      color: #605e5c;
    }

    .filter-actions {
      margin-top: 8px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .filter-section {
      margin-bottom: 8px;
    }

    /* Group visual styles */
    .group-block {
      border: 1px solid #c8c6c4;
      border-radius: 2px;
      padding: 4px;
      margin-bottom: 4px;
      background-color: #faf9f8;
      position: relative;
    }

    .group-block.selected {
      border-color: #605e5c;
      background-color: #edebe9;
    }

    .group-header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      font-size: 11px;
      color: #605e5c;
    }

    .group-header-row button {
      margin-right: 6px;
      font-size: 11px;
      padding: 2px 6px;
    }

    .group-header-label {
      font-weight: 600;
    }

    .group-rows-container {
      /* contains individual filter-row divs and nested groups */
    }

    /* Flyout */
    .flyout {
      position: absolute;
      background: #ffffff;
      border: 1px solid #c8c6c4;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.2);
      padding: 4px;
      font-size: 11px;
      z-index: 10001;
    }

    .flyout button {
      width: 100%;
      text-align: left;
      padding: 2px 6px;
      margin: 2px 0;
      font-size: 11px;
    }

    .flyout button:hover {
      background-color: #edebe9;
    }

    /* Indentation for groups (for nested groups / rows) */
    .indent-level-0 {
      margin-left: 0;
    }

    .indent-level-1 {
      margin-left: 16px;
    }

    .indent-level-2 {
      margin-left: 32px;
    }

    /* Toasts */
    #toastContainer {
      position: fixed;
      bottom: 12px;
      right: 12px;
      z-index: 10000;
      display: flex;
      flex-direction: column-reverse;
      gap: 4px;
      pointer-events: none;
    }

    .toast {
      background: #323130;
      color: #ffffff;
      padding: 6px 10px;
      border-radius: 2px;
      font-size: 11px;
      max-width: 280px;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.4);
      opacity: 0.95;
      animation: toast-slide-up 0.3s ease-out;
    }

    @keyframes toast-slide-up {
      from {
        transform: translateY(10px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 0.95;
      }
    }
  </style>
</head>

<body>
  <h3>Configuration Migration (Browser)</h3>

  <div class="toolbar">
    <button id="btnCreateSchema">Create Schema</button>
    <button id="btnExportData">Export Data</button>
    <button id="btnImportData">Import Data</button>
    <button id="btnSelectSchemaForImport" style="display:none;">Select Schema for Import</button>
  </div>

  <!-- Create Schema Modal -->
  <div id="schemaModal">
    <div class="schema-header">
      <h4>Create Schema (multi-table)</h4>
      <button id="btnCloseSchemaX" aria-label="Close schema dialog">×</button>
    </div>

    <div class="section">
      <label for="entityInput">Table (entity logical name)</label><br>
      <input list="entityList" id="entityInput" placeholder="Select or type table logical name">
      <datalist id="entityList"></datalist>
    </div>

    <div class="section">
      <input type="text" id="attributeSearch" placeholder="Search attribute">
      <label class="checkbox-inline" style="margin-left:12px;">
        <input type="checkbox" id="disablePluginsCheckbox">
        Disable plugins on import
      </label>
      <div style="margin-top:4px;">
        <label class="checkbox-inline">
          <input type="checkbox" id="allCustomFieldsCheckbox">
          All Custom Fields
        </label>
      </div>
    </div>

    <div class="schema-actions">
      <button id="btnAddEntity">Add</button>
      <button id="btnSaveSchema" title="This can be used in Microsoft Configuration Migration Tool">
        Export Schema
      </button>
    </div>

    <div class="schema-filter-toolbar">
      <button id="btnFilterFields">Filter</button>
    </div>

    <div class="grid-container">
      <div class="grid-header">
        <table>
          <thead>
            <tr>
              <th class="col-select">
                <input type="checkbox" id="selectAllFields">
              </th>
              <th class="col-attribute">Attribute</th>
              <th class="col-displayname">Display Name</th>
              <th class="col-type">Type</th>
              <th class="col-compare">Compare/Update</th>
              <th class="col-create">Create Only</th>
            </tr>
          </thead>
        </table>
      </div>
      <div class="grid-body">
        <table>
          <tbody id="attributesGridBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Filter Modal -->
  <div id="filterModal">
    <div class="filter-header">
      <h4>Filter</h4>
      <button id="btnCloseFilterX" aria-label="Close filter dialog">×</button>
    </div>

    <div id="filterRowsContainer" class="filter-rows-container"></div>

    <div class="filter-row-actions">
      <button id="btnAddFilterRow">Add Condition</button>
      <button id="btnGroupOr">GROUP OR</button>
      <button id="btnGroupAnd">Group AND</button>
      <label>Use flyout to select rows/groups, then group.</label>
    </div>

    <div class="filter-section">
      <label for="fetchXmlOutput">Generated FetchXML Filter</label><br>
      <textarea id="fetchXmlOutput" readonly
        style="width:100%; height:120px; padding:4px; border:1px solid #c8c6c4; border-radius:2px; font-size:11px; font-family:Consolas, monospace;"></textarea>
    </div>

    <div class="filter-actions">
      <button id="btnApplyFilter">Apply</button>
      <button id="btnClearFilter">Clear</button>
    </div>
  </div>

  <!-- Import Modal -->
  <div id="importModal">
    <div class="import-header">
      <h4>Import Configuration Data</h4>
      <button id="btnCloseImportX" aria-label="Close import dialog">×</button>
    </div>

    <div class="import-section">
      <label>Target Environment</label>
      <div id="envRadioList" class="env-radio-list"></div>
      <div id="manualEnvContainer" style="margin-top:4px; display:none;">
        <label for="manualEnvUrl">Environment URL</label>
        <input type="text" id="manualEnvUrl" placeholder="https://org.crm.dynamics.com">
      </div>
    </div>

    <div class="import-section">
      <label for="dataFileInputImport">Select Data File (JSON)</label><br>
      <input type="file" id="dataFileInputImport" accept=".json">
    </div>

    <div class="import-section">
      <label for="schemaFileInputImport">Select Schema (XML)</label><br>
      <input type="file" id="schemaFileInputImport" accept=".xml">
    </div>

    <div class="import-actions">
      <button id="btnImportDataStart" disabled>Import Data</button>
    </div>
  </div>

  <div id="toastContainer"></div>

  <input type="file" id="schemaFileInput" accept=".xml" style="display:none;">
  <input type="file" id="dataFileInput" accept=".json" style="display:none;">

  <script src="popup.js"></script>
</body>

</html>
